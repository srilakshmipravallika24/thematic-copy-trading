version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: thematic-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  backend:
    build: ./backend
    container_name: thematic-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/thematic_copy_trading
      - JWT_SECRET=super_secure_jwt_secret_key_ria_thematic_2026
      - NODE_ENV=production
    depends_on:
      - mongodb
    restart: always

  frontend:
    build: ./frontend
    container_name: thematic-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:
